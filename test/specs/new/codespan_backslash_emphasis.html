<p>Note that <code>\</code> or <code>/</code> <em>will</em> be interpreted as path separators on Windows, and will match against <code>/</code> in glob expressions.</p>

<p>Use <code>C:\Users\</code> for <strong>home</strong> and <code>D:\</code> for data.</p>

<p><code>a\</code> <em>b</em> <code>c</code></p>

<p>`<em>escaped tick</em>` <code>code</code></p>

<p><code>\</code> <code>\</code> <strong>after double backticks</strong></p>
